# Every push and pull request runs the whole safety net: types, lint, unit tests,
# then the browser tests against a production build. A red run on GitHub is
# the v2 equivalent of a failed row on a manual QA checklist.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch makes an in-progress run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser tests (builds the app first)
        run: npm run e2e

      # Only on failure: the HTML report and traces show exactly what the
      # browser saw at each step, which is how a red run gets diagnosed.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
